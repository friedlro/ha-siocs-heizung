# In configuration.yaml einfuegen (File editor), danach Konfiguration pruefen + HA neu starten.
# HOST unten (local-siocs-heizung) ggf. durch den echten Hostnamen der App ersetzen.

rest:
  - resource: http://local-siocs-heizung:8099/state
    scan_interval: 60
    sensor:
      - name: "Heizung Raumtemperatur"
        value_template: "{{ value_json.room_temp }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: "Heizung Raumsoll"
        value_template: "{{ value_json.room_setpoint }}"
        unit_of_measurement: "°C"
        device_class: temperature
      - name: "Heizung Korrektur"
        value_template: "{{ value_json.offset }}"
        unit_of_measurement: "K"
      - name: "Heizung Aussentemperatur Regelung"
        value_template: "{{ value_json.outdoor_avg_control }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: "Heizung Leistung"
        value_template: "{{ value_json.power_kw }}"
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
      - name: "Heizung Spreizung"
        value_template: "{{ value_json.spread_k }}"
        unit_of_measurement: "K"
        state_class: measurement
      - name: "Heizung Waermemenge"
        value_template: "{{ value_json.energy_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Heizung Volumen"
        value_template: "{{ value_json.volume_m3 }}"
        unit_of_measurement: "m³"
        device_class: water
        state_class: total_increasing
      - name: "Heizung Status"
        value_template: "{{ value_json.mode_status }}"
      - name: "Heizung Betriebsart gewaehlt"
        value_template: "{{ value_json.mode_selected }}"

rest_command:
  siocs_set_mode:
    url: http://local-siocs-heizung:8099/mode
    method: post
    content_type: application/json
    payload: '{"mode": "{{ mode }}"}'
    timeout: 60
  siocs_set_offset:
    url: http://local-siocs-heizung:8099/offset
    method: post
    content_type: application/json
    payload: '{"value": {{ value }}}'
    timeout: 60

template:
  - select:
      - name: "Heizung Betriebsart"
        unique_id: siocs_heizung_betriebsart
        options: [auto, off, setback, heat, schedule, party]
        state: "{{ states('sensor.heizung_betriebsart_gewaehlt') }}"
        select_option:
          - action: rest_command.siocs_set_mode
            data:
              mode: "{{ option }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.heizung_betriebsart_gewaehlt
  - number:
      - name: "Heizung Korrektur Einstellen"
        unique_id: siocs_heizung_korrektur
        min: -5
        max: 5
        step: 0.1
        unit_of_measurement: "K"
        state: "{{ states('sensor.heizung_korrektur') }}"
        set_value:
          - action: rest_command.siocs_set_offset
            data:
              value: "{{ value }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.heizung_korrektur
